[project]
name = "selfaccent"
version = "0.1.0"
description = "Unofficial implementation of self-distilled pronunciation and pitch-accent control for Japanese neural TTS (arXiv 2609.17234)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.4",
    "soundfile>=0.12",
    "pyopenjtalk-plus>=0.4",
    "pyworld>=0.3.4",
    # pyworld still imports pkg_resources, which setuptools>=81 no longer ships
    "setuptools<81",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfaccent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
